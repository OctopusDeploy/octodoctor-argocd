site_name: OctoDoctor for Argo CD
site_url: https://octodoctor-argocd.readthedocs.io/
repo_url: https://github.com/OctopusDeploy/octodoctor-argocd

markdown_extensions:
- admonition
- footnotes
- pymdownx.highlight
- pymdownx.superfences
- pymdownx.tabbed:
    alternate_style: true
- toc:
    permalink: true

nav:
- Introduction: index.md
- Installation: installation.md
- Rules: rules.md

theme:
  name: material
  logo: octodoctor-logo.png
  font:
    text: Work Sans
  palette:
  - primary: teal
    scheme: default
    toggle:
      icon: material/toggle-switch-off-outline
      name: Switch to dark mode
  - scheme: slate
    toggle:
      icon: material/toggle-switch
      name: Switch to light mode
