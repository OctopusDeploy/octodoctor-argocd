name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Allow manual triggering for testing

permissions:
  contents: write # Required for creating releases

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags are mandatory: the guard below needs origin/main
          # to exist, and GoReleaser derives the version and changelog from tags.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      # Must stay ahead of the GoReleaser step, or a tag cut from a feature
      # branch would be published first and rejected afterwards.
      - name: Verify tag is from main branch
        run: |
          # Get the commit hash of the tag
          TAG_COMMIT=$(git rev-list -n 1 ${{ github.ref }})
          # Check if this commit exists in main branch
          if ! git merge-base --is-ancestor $TAG_COMMIT origin/main; then
            echo "Error: Tag ${{ github.ref_name }} is not from main branch"
            exit 1
          fi
          echo "Tag ${{ github.ref_name }} is from main branch ✓"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: '~> v2' # pin the major; never float to latest
          # A manual run has no tag to release, so it builds a snapshot and
          # publishes nothing, which keeps workflow_dispatch usable as a dry run.
          args: ${{ github.ref_type == 'tag' && 'release --clean' || 'release --snapshot --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
