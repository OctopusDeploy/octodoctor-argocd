## Matrix with duplicate generators. Complex and problematic
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-git
spec:
  generators:
  - matrix:
      generators:
      - list:
          elements:
          - myapp: argocd-sample-app
            myenv: stage
          - myapp: blog-client
            myenv: stage
          - myapp: blog-server
            myenv: prod
      - list:
          elements:
          - cluster: prod
            region: east
          - cluster: prod
            region: west
          - cluster: staging
            region: west
  template:
    metadata:
      name: '{{path.basename}}-{{name}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/codefresh-contrib/gitops-cert-level-2-examples.git
        targetRevision: HEAD
        path: '{{path}}'
      destination:
        server: '{{server}}'
        namespace: '{{path.basename}}'