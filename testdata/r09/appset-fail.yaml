## Matrix with duplicate generators. Complex and problematic
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cluster-git
spec:
  generators:
    # matrix 'parent' generator
    - matrix:
        generators:
          # Git generator, 'child' #1
          - git:
              repoURL: https://github.com/example-org/gitops-examples.git
              revision: HEAD
              directories:
                - path: application-sets/example-apps/*
          # Git generator, 'child' #2
          - git:
              repoURL: https://github.com/example-org/gitops-examples.git
              revision: HEAD
              directories:
                - path: application-sets/example-apps/values/*
  template:
    metadata:
      name: '{{path.basename}}-{{name}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/example-org/gitops-examples.git
        targetRevision: HEAD
        path: '{{path}}'
      destination:
        server: '{{server}}'
        namespace: '{{path.basename}}'