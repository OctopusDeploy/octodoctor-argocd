## R06 - Example with manifest-generate-paths (absolute path)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/manifest-generate-paths: /apps
spec:
  project: default

  source:
    repoURL: https://github.com/example-org/not-important.git
    targetRevision: HEAD
    path: ./not-important
   
    # directory
    directory:
      recurse: false
  # Destination cluster and namespace to deploy the application
  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated: 


  