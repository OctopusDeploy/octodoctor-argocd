## R08 - Example where automated has no value
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/example-org/not-important.git
    targetRevision: HEAD
    path: ./not-important
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
