apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-proper-kustomize-app-multi
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: my-app
  sources:
    - repoURL: https://github.com/example-org/example-repo.git  
      targetRevision: HEAD  
      ## DO THIS. Save all values in the Kustomize Overlay itself
      path: my-app/overlays/prod
    - repoURL: https://github.com/example-org/common-settings.git
      targetRevision: HEAD
      path: config

