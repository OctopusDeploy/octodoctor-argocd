apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: checkout
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/example-org/not-important.git
    targetRevision: HEAD
    path: ./checkout
  destination:
    server: https://kubernetes.default.svc
    namespace: checkout
