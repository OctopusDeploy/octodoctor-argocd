apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: billing
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/example-org/not-important.git
    targetRevision: HEAD
    path: ./billing
  destination:
    server: https://kubernetes.default.svc
    namespace: billing
